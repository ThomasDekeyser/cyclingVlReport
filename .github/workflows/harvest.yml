name: Harvest race results

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q

      - name: Harvest
        run: python -m scripts.harvest

      - name: Commit if changed
        run: |
          # `generated_at` is stamped fresh on every successful run, so this
          # file differs and this branch is taken on every run in practice.
          # It's kept as a safety net in case that ever stops being true.
          if git diff --quiet -- static/data/results.json; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/results.json
          git commit -m "data: refresh 90-day harvest"
          git push
